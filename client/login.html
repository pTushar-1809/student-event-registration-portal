<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 20px;">Welcome Back</h2>
            <div id="serverMessage" style="text-align: center; margin-bottom: 15px; font-weight: 500;"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="student@mitwpu.edu.in" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit">Log In</button>
                
                <div class="links">
                    <p>Don't have an account? <a href="register.html">Register here</a></p>
                    <p style="margin-top: 10px;"><a href="index.html">← Back to Home</a></p>
                </div>
            </form>
        </div>
    </div>
    <script src="./js/login.js"></script>
</body>
</html>
