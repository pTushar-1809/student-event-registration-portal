<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Portal - Home</title>
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        .hero { text-align: center; margin-top: 8vh; padding: 60px 20px; background: white; border-radius: var(--radius); box-shadow: var(--shadow); }
        .hero h1 { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 20px; }
        .hero p { font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 30px; }
        .hero-buttons { display: flex; gap: 15px; justify-content: center; }
        .hero-buttons a { text-decoration: none; width: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>MIT-WPU Campus Event Portal</h1>
            <p>Discover campus activities, register for technical workshops, manage your event waitlists, and elevate your student experience.</p>
            <div class="hero-buttons">
                <a href="login.html"><button>Login</button></a>
                <a href="register.html"><button style="background-color: var(--text-main);">Register</button></a>
            </div>
        </div>
    </div>
</body>
</html>
